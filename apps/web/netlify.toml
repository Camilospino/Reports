# Netlify: en la interfaz, "Package directory" = apps/web y "Base directory" vacío (raíz del repo),
# para que se instalen las dependencias de todo el monorepo (npm workspaces).
# Las rutas de este archivo son relativas a la raíz del repo, y lo que dice aquí manda sobre la interfaz.
[build]
  command = "npm run build -w web"
  publish = "apps/web/.next"
  # Solo publica si cambió la web, su base de datos compartida o las dependencias (cada publicación
  # gasta créditos del plan gratis). Un cambio solo en apps/mobile no dispara un build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/db package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
  # npm 10 falla ("The from argument must be of type string") al actualizar dependencias sobre la
  # caché de node_modules que guarda Netlify entre builds; npm 11 lo hace bien.
  NPM_VERSION = "11"
  # Telemetría de Next.js apagada en los builds.
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador de Next.js declarado a mano: en este monorepo Netlify no lo detectó solo ("Detected 0
# framework(s)") y publicó la carpeta del código como archivos sueltos. Con el adaptador, las páginas
# del servidor, el middleware y las rutas de API se convierten en funciones de Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"
